<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>だるまさんを起こして！ — WAKE SEVEN</title>
<script>

<style>
  :root{
    --ai:#16283C; --ai2:#1F3752;
    --washi:#F3E8D5; --washi2:#C8CDD1;
    --kin:#C9A54E; --sumi:#241D1A; --shu:#C8352C;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--ai);
    background-image:radial-gradient(120% 70% at 50% 0%,var(--ai2) 0%,var(--ai) 62%);
    color:var(--washi);font-family:"A1 Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    min-height:100vh;padding:26px 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;
  }
  .brand{position:relative;width:100%;max-width:372px;display:flex;flex-direction:column;align-items:center}
  .language-picker{position:absolute;z-index:20;top:0;right:0}
  .language-toggle{
    display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.14);
    border-radius:50%;background:rgba(22,40,60,.72);color:#9FB0C4;font-size:17px;cursor:pointer;
  }
  .language-toggle:hover,.language-toggle[aria-expanded="true"]{border-color:#62B8D2;color:#62B8D2}
  .language-toggle:focus-visible{outline:2px solid var(--washi);outline-offset:2px}
  .language-menu{
    position:absolute;top:calc(100% + 7px);right:0;display:none;width:150px;padding:5px;
    border:1px solid rgba(255,255,255,.14);border-radius:9px;background:#172C43;
    box-shadow:0 18px 44px rgba(0,0,0,.45);
  }
  .language-menu.show{display:grid}
  .language-menu button{
    min-height:38px;padding:7px 10px;border:0;border-radius:6px;background:transparent;
    color:#9FB0C4;font:inherit;font-size:12px;font-weight:700;line-height:1.2;text-align:left;cursor:pointer;
  }
  .language-menu button:hover{background:rgba(98,184,210,.1);color:var(--washi)}
  .language-menu button[aria-checked="true"]{background:#183952;color:#62B8D2}
  h1{font-size:25px;font-weight:800;letter-spacing:.07em;margin-top:8px}
  .sub{
    display:flex;align-items:center;gap:10px;font-size:10px;font-weight:750;
    letter-spacing:.27em;color:var(--kin);
  }
  .sub::before,.sub::after{
    content:"";width:30px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,165,78,.8));
  }
  .sub::after{background:linear-gradient(90deg,rgba(201,165,78,.8),transparent)}
  .bar{display:flex;gap:8px;margin:18px 0 2px;flex-wrap:wrap;justify-content:center}
  .chip{
    font:inherit;font-size:13px;color:#B9C6D6;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 18px;cursor:pointer;transition:.18s;
  }
  .chip:hover{background:rgba(255,255,255,.13)}
  .chip.on{background:var(--kin);color:var(--ai);border-color:var(--kin);font-weight:600}
  .chip:focus-visible{outline:2.5px solid var(--washi);outline-offset:3px}
  .stage-nav{
    width:100%;max-width:372px;display:grid;grid-template-columns:72px 1fr 72px;
    align-items:center;gap:8px;margin-top:18px;
  }
  .stage-nav .chip{padding:9px 8px}
  .stage-title{text-align:center;line-height:1.35;color:#9FB0C4;font-size:11px;letter-spacing:.08em}
  .stage-title b{display:block;color:var(--washi);font-size:17px;letter-spacing:.04em}
  .stage-title span{color:#9FB0C4}
  .progress{
    width:100%;max-width:372px;display:grid;grid-template-columns:repeat(15,1fr);
    gap:5px;margin:12px 0 2px;
  }
  .progress button{
    height:6px;border:0;border-radius:999px;background:rgba(255,255,255,.13);
    cursor:pointer;transition:.18s;padding:0;
  }
  .progress button.cleared{background:rgba(201,165,78,.55)}
  .progress button.current{box-shadow:0 0 0 2px var(--kin)}
  .progress button:disabled{
    background:rgba(255,255,255,.1);box-shadow:none;cursor:default;
  }
  .progress button:focus-visible{outline:2px solid var(--washi);outline-offset:3px}
  .mode-row{
    width:100%;max-width:372px;display:flex;align-items:center;gap:8px;margin-top:10px
  }
  .mode-row .chip{font-size:11px;padding:6px 12px;background:transparent;border-color:rgba(255,255,255,.1)}
  .mode-switches{display:flex;gap:5px;margin-left:auto}
  .mode-switches .chip{font-size:10px;padding:6px}
  .mode-switches .chip.on{
    background:var(--kin);color:var(--ai);border-color:var(--kin);font-weight:600;
  }
  .status-metric{display:flex;align-items:baseline;gap:5px;color:#9FB0C4;font-size:11px;letter-spacing:.06em}
  .status-metric b{color:var(--kin);font-size:30px;line-height:1;font-weight:750;font-variant-numeric:tabular-nums}
  .status-metric.moves b{color:var(--washi);font-size:30px}
  .status-separator{color:rgba(255,255,255,.26);font-size:23px;font-weight:300}
  .stage-title span.hint-info{color:#62B8D2;font-weight:700}
  .status-metric.moves b.pulse{animation:movePulse .3s cubic-bezier(.2,.8,.25,1)}
  .playbar{
    width:100%;max-width:372px;display:flex;justify-content:flex-end;margin-top:10px;
  }
  @keyframes movePulse{
    0%{transform:scale(1);color:var(--washi);text-shadow:none}
    42%{transform:scale(1.28);color:var(--kin);text-shadow:0 0 12px rgba(201,165,78,.65)}
    100%{transform:scale(1);color:var(--washi);text-shadow:none}
  }
  .play-actions{width:100%;display:flex;gap:5px;margin-left:auto}
  .play-actions .chip{flex:1;white-space:nowrap;padding:8px 5px;font-size:11px}
  .clear-actions{
    width:100%;max-width:372px;min-height:42px;margin-top:2px;
    display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;
  }
  .clear-actions .chip{grid-column:2}
  .clear-actions .chip[hidden]{display:none}
  .clear-actions .tip-button{grid-column:1;justify-self:start}
  .clear-actions .maker-link{grid-column:2;justify-self:center}
  .clear-actions .progress-reset{grid-column:3;justify-self:end}
  .tip-button,.maker-link,.progress-reset{
    padding:5px 4px;border:0;background:none;color:#718297;
    font:inherit;font-size:11px;text-decoration:underline;text-underline-offset:3px;
    cursor:pointer;transition:color .18s;

  .tip-button:hover,.maker-link:hover,.progress-reset:hover{color:#A8B6C7}
  .tip-button:focus-visible,.maker-link:focus-visible,.progress-reset:focus-visible{
    outline:2px solid var(--washi);outline-offset:3px;border-radius:3px
  }
  .maker-link.ready{
    padding:9px 16px;border-radius:999px;background:var(--kin);color:var(--ai);
    font-weight:600;text-decoration:none;
  }
  .maker-link.ready:disabled{
    background:rgba(255,255,255,.08);color:#65768A;cursor:default;opacity:.72;
  }
  .maker-link[hidden]{display:none}

  .board-wrap{position:relative;width:100%;max-width:372px;margin-top:14px}
  #board{
    width:100%;height:auto;display:block;margin:0;
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;overflow:visible;
  }
  .board-view-controls{
    position:absolute;z-index:2;top:3px;left:4px;right:4px;
    display:flex;justify-content:space-between;pointer-events:none;
  }
  .view-button{
    pointer-events:auto;padding:5px 4px;border:0;background:rgba(22,40,60,.72);
    color:#718297;font:inherit;font-size:10px;border-radius:4px;cursor:pointer;
    transition:color .18s,background .18s;
  }
  .view-button:hover{color:#A8B6C7;background:rgba(22,40,60,.9)}
  .view-button:focus-visible{outline:2px solid var(--washi);outline-offset:2px}
  #board.spinning{cursor:grabbing}
  .tile{
    transform-box:view-box;transform-origin:0 0;will-change:transform;
    transition:opacity .12s ease,filter .12s ease;
  }
  .tile.stand{filter:brightness(1.04)}
  .tile.fallen{filter:none}
  #board.selecting .tile{opacity:.58;filter:saturate(.72) brightness(.82)}
  #board.selecting .tile.selected{
    opacity:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.24)) brightness(1.04)
  }
  #board.selecting .tile.selected.stand{filter:drop-shadow(0 6px 6px rgba(0,0,0,.24)) brightness(1.07)}
  #board.selecting .tile.selected.fallen{filter:drop-shadow(0 6px 6px rgba(0,0,0,.24)) saturate(.92)}
  #board.selecting .pivot{opacity:.22}
  #board.selecting .pivot.active{opacity:1}
  #board.hinting .tile{opacity:.58;filter:saturate(.72) brightness(.82)}
  #board.hinting .tile.selected{
    opacity:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.24)) brightness(1.04)
  }
  #board.hinting .tile.selected.stand{filter:drop-shadow(0 6px 6px rgba(0,0,0,.24)) brightness(1.07)}
  #board.hinting .tile.selected.fallen{filter:drop-shadow(0 6px 6px rgba(0,0,0,.24)) saturate(.92)}
  .hex{fill:var(--washi);stroke:#C0AC88;stroke-width:1.5}
  .tile.fallen .hex{fill:var(--washi2);stroke:#9EA8AF}
  .tile.stand .shut,.tile.fallen .open{display:none}
  .tile .happy{display:none}
  #board.celebrating .tile .open,#board.celebrating .tile .shut{display:none}
  #board.celebrating .tile .happy{display:block}
  .pivot{pointer-events:none}
  .pivot .dot{fill:var(--kin);opacity:.72;stroke:none;transition:.16s ease}
  .pivot.hi .dot,.pivot.active .dot{
    opacity:1;filter:drop-shadow(0 0 5px rgba(201,165,78,.8))
  }
  .hint-arrow{pointer-events:none;animation:hintArrow 1.35s ease both}
  .hint-arrow.tutorial{animation:none;opacity:1}
  .hint-arrow .arc{
    fill:none;stroke:#62B8D2;stroke-width:5.5;stroke-linecap:round;
    filter:drop-shadow(0 0 3px rgba(22,40,60,.9));
  }
  .hint-arrow .head{fill:#62B8D2;filter:drop-shadow(0 0 3px rgba(22,40,60,.9))}
  .axis-guide{pointer-events:none}
  .axis-guide .ray{fill:none;stroke:#62B8D2;stroke-linecap:round}
  .axis-guide .ray{stroke-width:2;opacity:.48;stroke-dasharray:3 5}
  .axis-guide .axis-ring{
    fill:none;stroke:#62B8D2;stroke-width:2;transform-box:fill-box;
    transform-origin:center;animation:axisGuidePulse .55s ease-out both;
  }
  @keyframes axisGuidePulse{
    0%{opacity:.95;transform:scale(.45)}
    100%{opacity:.12;transform:scale(1.8)}
  }
  @keyframes hintArrow{
    0%{opacity:0}18%,72%{opacity:1}100%{opacity:0}
  }
  .msg{
    width:100%;max-width:372px;height:38px;margin-top:6px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-size:16px;line-height:1.4;font-family:"Hiragino Mincho ProN",serif;
    color:var(--kin);opacity:0;transition:opacity .35s ease;text-align:center;
  }
  .msg.show{opacity:1}
  .msg.tip{
    width:100%;max-width:372px;font-family:inherit;font-size:clamp(9px,2.8vw,11.5px);
    color:#A8B6C7;white-space:nowrap;
  }
  .msg.tip.long-tip{
    padding:0 6px;font-size:clamp(10px,2.8vw,11.5px);
    line-height:1.45;white-space:normal;
  }
  .foot{margin-top:18px;font-size:12.5px;color:#7E8FA3;max-width:30em;text-align:center;line-height:1.9}
  @media (prefers-reduced-motion:reduce){
    .tile,.pivot{transition:none}
    .status-metric.moves b.pulse{animation:none}
  }
  @media (max-width:480px){
    body{padding-left:4px;padding-right:4px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
    .board-wrap{max-width:none}
    .stage-nav,.progress,.mode-row,.playbar{width:calc(100% - 8px)}
  }
  html.embed,html.embed body{min-height:0}
  html.embed body{
    padding-top:14px;
    padding-bottom:max(8px,env(safe-area-inset-bottom));
    overflow:hidden;
  }
  html.embed h1{margin-top:5px}
  html.embed .stage-nav{margin-top:12px}
</style>
</head>

<script>
const R=54, W=Math.sqrt(3)*R, H=1.5*R, OX=66.77, OY=74;
const CELL=[[0.5,0],[1.5,0],[0,1],[1,1],[2,1],[0.5,2],[1.5,2]]
  .map(([cx,ry])=>({x:OX+cx*W, y:OY+ry*H}));
const N=7;

/* 3枚が互いに隣り合う組（＝三角形）を座標から求め、時計回りに並べる */
const TRI=(()=>{
  const near=(a,b)=>Math.abs(Math.hypot(CELL[a].x-CELL[b].x,CELL[a].y-CELL[b].y)-W)<2;
  const out=[];
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)for(let c=b+1;c<N;c++)
    if(near(a,b)&&near(b,c)&&near(a,c)){
      const cx=(CELL[a].x+CELL[b].x+CELL[c].x)/3, cy=(CELL[a].y+CELL[b].y+CELL[c].y)/3;
      const t=[a,b,c].sort((p,q)=>Math.atan2(CELL[p].y-cy,CELL[p].x-cx)-Math.atan2(CELL[q].y-cy,CELL[q].x-cx));
      out.push({cells:t,x:cx,y:cy});
    }
  return out;
})();
function makeBoardPermutation(angleDeg=0,mirror=false){
  const center=CELL[3], q=angleDeg*Math.PI/180, co=Math.cos(q), si=Math.sin(q);
  return CELL.map(p=>{
    let x=p.x-center.x,y=p.y-center.y;
    if(mirror)x=-x;
    const tx=center.x+x*co-y*si,ty=center.y+x*si+y*co;
    let bestIndex=0,bestDistance=Infinity;
    CELL.forEach((target,i)=>{
      const d=Math.hypot(tx-target.x,ty-target.y);
      if(d<bestDistance){bestDistance=d;bestIndex=i;}
    });
    return bestIndex;
  });
}
const VIEW_ROTATE_60=makeBoardPermutation(60);
const VIEW_MIRROR=makeBoardPermutation(0,true);

/* ---- 全探索ソルバ（向き3値・7マス = 3進7桁） ---- */
const P3=[1,3,9,27,81,243,729], NS=2187;
const enc=o=>{let n=0;for(let i=0;i<N;i++)n+=o[i]*P3[i];return n;};
const dec=n=>{const a=new Uint8Array(N);for(let i=0;i<N;i++){a[i]=n%3;n=(n/3)|0;}return a;};
function swipeOnce(o,ti,dir){
  const t=Uint8Array.from(o), c=TRI[ti].cells;
  for(let i=0;i<3;i++){
    const f=dir>0?c[i]:c[(i+1)%3], to=dir>0?c[(i+1)%3]:c[i];
    t[to]=o[f];
  }
  return t;
}
function clickOnce(o,ti,dir=1){
  const t=Uint8Array.from(o);
  for(const i of TRI[ti].cells) t[i]=(t[i]+dir+3)%3;
  return t;
}
function rollOnce(o,ti,dir){
  const t=Uint8Array.from(o), c=TRI[ti].cells;
  for(let i=0;i<3;i++){
    const f=dir>0?c[i]:c[(i+1)%3], to=dir>0?c[(i+1)%3]:c[i];
    t[to]=(o[f]+(dir>0?1:2))%3;
  }
  return t;
}
function centerOnce(o,dir=1){

  let ti=0,bd=Infinity;
  TRI.forEach((t,i)=>{ const d=Math.hypot(t.x-p.x,t.y-p.y); if(d<bd){bd=d;ti=i;} });
  const t=TRI[ti], selectedTiles=new Set(t.cells.map(i=>tileEls[i]));
  // Keep the board dimmed while handing off from the stage-one hint to dragging.
  // Preserve the selected tiles so neither normal nor extra-dark brightness is shown.
  svg.classList.add('selecting');
  for(const i of t.cells) tileEls[i].classList.add('selected');
  cancelTutorialHint(true);
  baseTiles.forEach(el=>el.classList.toggle('selected',selectedTiles.has(el)));
  cancelTileAnimations();
  const r=Math.hypot(p.x-t.x,p.y-t.y);
  showAxisGuide(t);
  const items=t.cells.map(from=>({
    from,el:tileEls[from],turn:spin[from],
    dx:CELL[from].x-t.x,dy:CELL[from].y-t.y
  }));
  drag={
    id:e.pointerId,ti,kc:t,items,rawDeg:0,deg:0,
    last:r>=MINR?Math.atan2(p.y-t.y,p.x-t.x):null,
    start:p,t0:performance.now()
  };
  for(const item of items) item.el.classList.add('selected');
  svg.querySelector('.pivot[data-tri="'+ti+'"]').classList.add('active');
  svg.setPointerCapture(e.pointerId);
  svg.classList.add('spinning');
});
svg.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const p=toView(e), t=drag.kc;
  const dx=p.x-t.x, dy=p.y-t.y;
  if(Math.hypot(dx,dy)<MINR){ drag.last=null; return; }
  const a=Math.atan2(dy,dx);
  if(drag.last===null){ drag.last=a; return; }
  let d=a-drag.last;
  while(d>Math.PI) d-=2*Math.PI;
  while(d<-Math.PI) d+=2*Math.PI;
  drag.last=a;
  drag.rawDeg+=d*180/Math.PI;
  drag.deg=drag.rawDeg;
  const guideRays=svg.querySelector('.axis-guide .axis-rays');
  if(guideRays)guideRays.setAttribute('transform','rotate('+drag.deg+' '+t.x+' '+t.y+')');
  showMoves(moves+(effectiveTurn(Math.round(drag.deg/120))?1:0));
  for(const item of drag.items){
    item.el.style.transform=orbitTransform(item,drag.deg,t);
    previewWake(item,drag.deg);
  }
});
function finishDrag(e,cancel=false){
  if(!drag||(e&&e.pointerId!==drag.id)) return;
  const dg=drag; drag=null; clearAxisGuide(); svg.classList.remove('spinning');
  svg.classList.remove('selecting');
  for(const item of dg.items) item.el.classList.remove('selected');
  svg.querySelectorAll('.pivot.active').forEach(el=>el.classList.remove('active'));
  try{svg.releasePointerCapture(dg.id);}catch(_){}

  let turns=cancel?0:Math.round(dg.deg/120);
  if(!turns&&Math.abs(dg.deg)>=18&&performance.now()-dg.t0<320)
    turns=dg.deg>0?1:-1;
  const target=turns*120;
  const dir=effectiveTurn(turns);
  const waking=dir?dg.items.filter(item=>mod3(item.turn)!==0&&mod3(item.turn+dir)===0).map(item=>item.el):[];
  if(dir) applySwipe(dg.ti,dir,true);
  paint();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){wakeFeedback(waking);return;}
  const delta=Math.abs(target-dg.deg);
  if(delta<.1){wakeFeedback(waking);return;}
  busy=true; let done=0;
  for(const item of dg.items){
    const a=item.el.animate([
      {transform:orbitTransform(item,dg.deg,dg.kc)},
      {transform:orbitTransform(item,target,dg.kc)}
    ],{duration:Math.max(190,Math.min(620,delta*4.65)),easing:'cubic-bezier(.2,.75,.25,1)'});
    a.onfinish=a.oncancel=()=>{ if(++done===3){busy=false;paint();wakeFeedback(waking);} };
  }
}

function showHintArrow(ti,dir,both=false,persistent=false){
  clearHintVisuals();
  const NS_='http://www.w3.org/2000/svg',t=TRI[ti],r=38;
  svg.classList.add('hinting');
  for(const i of t.cells) tileEls[i].classList.add('selected');
  // Start on the outer side of each pivot. At this point the intended pivot is
  // always the nearest one, so grabbing the arrow cannot select its neighbour.
  const boardCenter=CELL[3];
  const outwardAngle=Math.atan2(t.y-boardCenter.y,t.x-boardCenter.x)*180/Math.PI;
  const startAngle=outwardAngle,endAngle=startAngle+dir*250;
  const shaftEnd=endAngle-dir*22;
  const point=a=>{
    const q=a*Math.PI/180;
    return {x:t.x+r*Math.cos(q),y:t.y+r*Math.sin(q)};
  };
  const start=point(startAngle), base=point(shaftEnd), tip=point(endAngle);
  const q=endAngle*Math.PI/180;
  const ax=-Math.sin(q)*dir, ay=Math.cos(q)*dir;
  const nx=-ay, ny=ax;
  const w1={x:base.x+nx*9,y:base.y+ny*9};
  const w2={x:base.x-nx*9,y:base.y-ny*9};
  let secondHead='';
  if(both){
    const sb=point(startAngle+dir*22), sq=startAngle*Math.PI/180;
    const sax=Math.sin(sq)*dir, say=-Math.cos(sq)*dir;
    const snx=-say, sny=sax;
    const sw1={x:sb.x+snx*9,y:sb.y+sny*9};
    const sw2={x:sb.x-snx*9,y:sb.y-sny*9};
    secondHead='<path class="head" d="M '+start.x.toFixed(2)+' '+start.y.toFixed(2)
      +' L '+sw1.x.toFixed(2)+' '+sw1.y.toFixed(2)
      +' L '+sw2.x.toFixed(2)+' '+sw2.y.toFixed(2)+' Z"/>';
  }
  const g=document.createElementNS(NS_,'g');
  g.setAttribute('class','hint-arrow'+(persistent?' tutorial':''));
  g.innerHTML='<path class="arc" d="M '+start.x.toFixed(2)+' '+start.y.toFixed(2)
    +' A '+r+' '+r+' 0 1 '+(dir>0?1:0)+' '+base.x.toFixed(2)+' '+base.y.toFixed(2)+'"/>'
    +'<path class="head" d="M '+tip.x.toFixed(2)+' '+tip.y.toFixed(2)
    +' L '+w1.x.toFixed(2)+' '+w1.y.toFixed(2)
    +' L '+w2.x.toFixed(2)+' '+w2.y.toFixed(2)+' Z"/>'+secondHead;
  svg.appendChild(g);
  if(!persistent)setTimeout(()=>{if(g.isConnected) clearHintVisuals();},1400);
}

  if(editingBoard)showMakerMessage();
  else if(clearShown){
    const m=$('msg');
    m.textContent=moves===best?tr('optimalClear'):tr('clear');
    const action=$('clearNext');
    if(freeMode)action.textContent=tr('another');
    else if(customMode)action.textContent=tr('again');
    else if(stageIndex===STAGES.length-1)action.textContent=tr('toFree');
    else action.textContent=tr('nextPuzzle');
  }else if(lastTipIndex>=0&&$('msg').classList.contains('tip')){
    const tips=PLAY_TIPS[currentLang]||PLAY_TIPS.ja;
    $('msg').textContent=tips[lastTipIndex];
    $('msg').classList.toggle('long-tip',tips[lastTipIndex].length>34);
  }
  if(window.reportWake7EmbedHeight)window.reportWake7EmbedHeight();
}
$('languageToggle').addEventListener('click',e=>{
  e.stopPropagation();
  const menu=$('languageMenu'),open=!menu.classList.contains('show');
  menu.classList.toggle('show',open);
  $('languageToggle').setAttribute('aria-expanded',String(open));
  if(open){
    const selected=menu.querySelector('[data-lang="'+currentLang+'"]');
    if(selected)selected.focus();
  }
});
document.querySelectorAll('[data-lang]').forEach(button=>{
  button.addEventListener('click',()=>{
    applyLanguage(button.dataset.lang);
    $('languageMenu').classList.remove('show');
    $('languageToggle').setAttribute('aria-expanded','false');
    $('languageToggle').focus();
  });
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.language-picker')){
    $('languageMenu').classList.remove('show');
    $('languageToggle').setAttribute('aria-expanded','false');
  }
});
$('resetProgress').addEventListener('click',()=>{
  if(!confirm(tr('resetConfirm'))) return;
  clearedStages.clear();
  try{localStorage.removeItem('wake7-cleared');}catch(_){}
  loadStage(0);
});

buildBoard();
renderProgress();
loadStage(0);
applyLanguage('ja');

if(document.documentElement.classList.contains('embed')&&window.parent!==window){
  const embedContentEnd=document.querySelector('.clear-actions');
  const reportEmbedHeight=()=>{
    requestAnimationFrame(()=>{
      const bodyStyle=getComputedStyle(document.body);
      const height=embedContentEnd.getBoundingClientRect().bottom+
        window.scrollY+parseFloat(bodyStyle.paddingBottom);
      window.parent.postMessage({
        type:'wake7:height',
        height:Math.ceil(height)
      },location.origin==='null'?'*':location.origin);
    });
  };
  window.reportWake7EmbedHeight=reportEmbedHeight;
  if(window.ResizeObserver){
    const embedResizeObserver=new ResizeObserver(reportEmbedHeight);
    embedResizeObserver.observe(document.body);
    embedResizeObserver.observe(embedContentEnd);
  }
  window.addEventListener('resize',reportEmbedHeight);
  window.addEventListener('load',reportEmbedHeight);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(reportEmbedHeight);
  reportEmbedHeight();
}
</script>
</body>
</html>
